<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#glow)"/>
  
  <!-- Accent circle -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

  <!-- Checkmark - represents verification/results -->
  <path d="M 70 100 L 90 120 L 140 70" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document lines - represents report -->
  <g opacity="0.3">
    <line x1="60" y1="145" x2="140" y2="145" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="155" x2="120" y2="155" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>