<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Results Portal</title>
<style>
/* ========= THEME VARIABLES (Dynamic Colors) ========= */
:root{
  --primary:#0b63ce;        /* ResultsHub blue */
  --accent:#f28c18;         /* ResultsHub orange */
  --success:#0f7a41;
  --bg1:#eef3f9;
  --bg2:#fdfefe;
  --text:#1f2933;
  --muted:#6b7280;
  --card:#ffffff;
  --border:#e5e7eb;
}

/* ========= GLOBAL ========= */
*{ box-sizing:border-box; }

body{
  font-family: 'Segoe UI', Tahoma, sans-serif;
  margin:0;
  color:var(--text);

  /* Dynamic gradient background */
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* ========= MAIN CARD ========= */
.container{
  width:95%;
  max-width:480px;
  margin:40px auto;
  padding:26px;
  background:var(--card);
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,0.08);
  border:1px solid var(--border);
  transition:0.3s ease;
}

.logo{
  width:115px;
  display:block;
  margin:0 auto 12px;
}

/* ========= TITLES ========= */
h2{
  margin:2px 0;
  font-size:20px;
  text-align:center;
}

h2:first-of-type{
  color:var(--primary);
  font-weight:700;
}

h2:last-of-type{
  color:var(--muted);
  font-weight:500;
}

.subtitle{
  text-align:center;
  color:var(--accent);
  font-style:italic;
  font-size:14px;
  margin-bottom:18px;
}

/* ========= FORM ========= */
label{
  display:block;
  margin-top:14px;
  font-weight:600;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  margin-top:6px;
  font-size:16px;
  border:1px solid var(--border);
  border-radius:6px;
  transition:0.2s ease;
}

input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(11,99,206,0.15);
}

/* ========= BUTTON ========= */
button{
  width:100%;
  padding:14px;
  margin-top:24px;
  background:linear-gradient(90deg,var(--primary),#094ea8);
  color:white;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:0.25s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(11,99,206,0.25);
}

/* ========= RESULTS ========= */
.results{
  display:none;
  margin-top:22px;
}

.student-info{
  text-align:center;
  font-weight:700;
  color:var(--success);
  margin-bottom:12px;
  font-size:16px;
}

.iframe-wrapper{
  width:100%;
  height:70vh;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
}

/* ========= FOOTER ========= */
footer{
  text-align:center;
  margin:30px 0;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo" alt="School Logo">

  <h2>ResultsHub</h2>
<h2>Examination Results Portal</h2>
<div class="subtitle">Fast • Secure • Reliable</div>

  <!-- FORM -->
  <form id="resultForm">
    <label for="examNo">Examination Number</label>
    <input type="text" id="examNo" required placeholder="Enter your examination number">

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" required>

    <button type="submit">View Report</button>
  </form>

  <!-- RESULTS -->
  <div class="results" id="resultsDiv">
    <div class="student-info" id="studentInfo"></div>
    <div class="iframe-wrapper">
      <iframe id="reportFrame"></iframe>
    </div>
  </div>
</div>

<footer>© 2026 – ResultsHub-Portal</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUeWYpbtWh0hgFxAOynQk2bYWt_YrweaYjTMsa1JIF7aCIihAPM506z1tjp3MaWFLQ/exec";

const form = document.getElementById("resultForm");
const resultsDiv = document.getElementById("resultsDiv");
const studentInfo = document.getElementById("studentInfo");
const reportFrame = document.getElementById("reportFrame");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const examNo = document.getElementById("examNo").value.trim();
  const dob = new Date(document.getElementById("dob").value)
              .toISOString().split("T")[0];

  const url = `${API_URL}?examNo=${examNo}&dob=${dob}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (!data.success) {
      alert("No report found for the entered details.");
      return;
    }

    const driveLink = `https://drive.google.com/file/d/${data.fileId}/preview`;

    studentInfo.textContent = "Examination Report – " + examNo;
    reportFrame.src = driveLink;

    form.style.display = "none";
    resultsDiv.style.display = "block";

  } catch (err) {
    alert("Something went wrong. Try again.");
  }
});
</script>

</body>
</html>
