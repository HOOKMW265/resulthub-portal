<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examination Results Portal</title> 
  
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

<style>
:root{
  --primary:#1e3a8a;
  --accent:#f59e0b;
  --success:#15803d;
  --bg1:#f8fafc;
  --bg2:#eef2f7;
  --text:#0f172a;
  --muted:#64748b;
  --card:#ffffff;
  --border:#e2e8f0;

  /* ✅ Neon accents */
  --neon:#3b82f6;
  --neon-soft:rgba(59,130,246,0.25);
}
*{ box-sizing:border-box; }

body{
  font-family:'Inter', sans-serif;
  margin:0;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

body.dark{
  --bg1:#0f172a;
  --bg2:#0b1220;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --border:#1f2937;
}

.container{
  width:95%;
  max-width:500px;
  margin:50px auto;
  padding:30px;
  background:var(--card);
  border-radius:14px;
  box-shadow:0 20px 40px rgba(2,6,23,0.08);
  border:1px solid var(--border);
  position:relative;
}

/* ✅ Neon glow behind card */
.container::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:16px;
  background:radial-gradient(circle at top left, var(--neon-soft), transparent 60%);
  z-index:-1;
  filter:blur(18px);
}

.logo{
  width:110px;
  display:block;
  margin:0 auto 14px;
}

.theme-toggle{
  position:absolute;
  top:15px;
  right:15px;
  cursor:pointer;
  font-size:13px;
  color:var(--muted);
}

h2{
  margin:3px 0;
  text-align:center;
}
h2:first-of-type{
  color:var(--primary);
  font-weight:700;
  font-size:22px;
}
h2:last-of-type{
  color:var(--muted);
  font-weight:500;
  font-size:15px;
  text-transform:uppercase;
}

.subtitle{
  text-align:center;
  color:var(--accent);
  font-style:italic;
  font-size:14px;
  margin-bottom:18px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:600;
  font-size:14px;
}

.input-wrapper{
  position:relative;
  margin-top:6px;
  display:flex;
  align-items:center;
}

input{
  width:100%;
  padding:13px;
  padding-right:50px;
  font-size:15px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#f9fbfd;
  flex:1;
}

/* ✅ Neon input focus */
input:focus{
  background:white;
  outline:none;
  border-color:var(--neon);
  box-shadow:0 0 0 3px var(--neon-soft),
             0 0 12px var(--neon-soft);
}

/* ✅ Eye icon toggle button - positioned at the end */
.eye-toggle{
  position:absolute;
  right:0;
  background:none;
  border:none;
  cursor:pointer;
  font-size:18px;
  color:var(--muted);
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  transition:0.3s ease;
  margin:0;
  box-shadow:none;
}

.eye-toggle:hover{
  color:var(--neon);
  transform:scale(1.15);
}

/* SVG icon styling */
.eye-toggle svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ✅ Premium glowing button */
button[type="submit"]{
  width:100%;
  padding:14px;
  margin-top:24px;
  background:var(--primary);
  color:white;
  font-size:15px;
  font-weight:600;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s ease;
  box-shadow:0 6px 18px rgba(30,58,138,0.25);
  position:relative;
}

button[type="submit"]:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px var(--neon-soft);
}

.loader{
  display:none;
  margin:18px auto;
  border:6px solid #e5e7eb;
  border-top:6px solid var(--primary);
  border-radius:50%;
  width:42px;
  height:42px;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

.results{
  display:none;
  margin-top:22px;
}

.student-info{
  text-align:center;
  font-weight:700;
  color:var(--success);
  margin-bottom:12px;
  font-size:16px;
}

/* ✅ Premium viewer depth */
.iframe-wrapper{
  width:100%;
  height:70vh;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 10px 30px rgba(2,6,23,0.12);
}

footer{
  text-align:center;
  margin:30px 0;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo" alt="ResultsHub Logo">
  <div class="theme-toggle" onclick="toggleTheme()">🌙 Dark mode</div>

  <h2>ResultsHub</h2>
  <h2>Examination Results Portal</h2>
  <div class="subtitle">Fast • Secure • Reliable</div>

  <form id="resultForm">
    <label>Examination Number</label>
    <div class="input-wrapper">
      <input type="password" id="examNo" required>
      <button type="button" class="eye-toggle" id="toggleEye">
        <svg viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <label>Date of Birth</label>
    <input type="date" id="dob" required>

    <button type="submit">View Report</button>
  </form>

  <div class="loader" id="loader"></div>

  <div class="results" id="resultsDiv">
    <div class="student-info" id="studentInfo"></div>

    <div class="iframe-wrapper">
      <iframe id="reportFrame" style="width:100%;height:100%;border:none;"></iframe>
    </div>

    <div style="text-align:center; margin-top:14px;">
      <a id="downloadBtn" target="_blank" style="
        display:inline-block;
        padding:10px 18px;
        background:#B30B00;;
        color:white;
        font-weight:600;
        border-radius:6px;
        text-decoration:none;">
        Download Report (PDF)
      </a>
    </div>
  </div>
</div>

<footer>© 2026 – ResultsHub-Portal</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzUeWYpbtWh0hgFxAOynQk2bYWt_YrweaYjTMsa1JIF7aCIihAPM506z1tjp3MaWFLQ/exec";

const form = document.getElementById("resultForm");
const resultsDiv = document.getElementById("resultsDiv");
const studentInfo = document.getElementById("studentInfo");
const reportFrame = document.getElementById("reportFrame");
const loader = document.getElementById("loader");
const examNoInput = document.getElementById("examNo");
const toggleEyeBtn = document.getElementById("toggleEye");

let isPasswordVisible = false;

function toggleTheme(){
  document.body.classList.toggle("dark");
}

// Toggle password visibility
toggleEyeBtn.addEventListener("click", function (e) {
  e.preventDefault();
  isPasswordVisible = !isPasswordVisible;
  
  if (isPasswordVisible) {
    examNoInput.type = "text";
    toggleEyeBtn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
        </path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    `;
  } else {
    examNoInput.type = "password";
    toggleEyeBtn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;
  }
});

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  loader.style.display = "block";

  const examNo = document.getElementById("examNo").value.trim();
  const dob = new Date(document.getElementById("dob").value).toISOString().split("T")[0];
  const url = `${API_URL}?examNo=${examNo}&dob=${dob}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    loader.style.display = "none";

    if (!data.success) {
      alert("No report found for the entered details.");
      return;
    }

    const previewUrl = `https://drive.google.com/file/d/${data.fileId}/preview`;
    const downloadUrl = `https://drive.google.com/uc?export=download&id=${data.fileId}`;

    reportFrame.src = previewUrl;
    document.getElementById("downloadBtn").href = downloadUrl;

    studentInfo.textContent = "Examination Report – " + examNo;

    form.style.display = "none";
    resultsDiv.style.display = "block";

  } catch {
    loader.style.display = "none";
    alert("Something went wrong. Try again.");
  }
});
</script>

</body>
</html>
